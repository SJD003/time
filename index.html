<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style>

  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}

</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ميزان المحاسبة - النجف الأشرف</title>
<link rel="manifest" href="manifest.json?v=9">
<meta name="theme-color" content="#5f27cd">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<div class="app">
  <div id="offlineIndicator" class="offline-badge"></div>
  
  <header class="header">
    <div class="header-top">
      <div class="dates">
        <div id="dateText" class="date-greg">--</div>
        <div id="hijriDateDisplay" class="date-hijri">--</div>
      </div>
      <button class="btn-prayer" onclick="togglePrayerMenu()">🕌 الأوقات</button>
    </div>
    
    <div id="prayerMenu" class="prayer-dropdown">
      <div class="prayer-grid">
        <div class="p-item"><span>الفجر</span><small>قبل الشروق بساعة</small><b id="t-fajr">--:--</b></div>
        <div class="p-item"><span>الظهر</span><small>+10 دقائق</small><b id="t-dhuhr">--:--</b></div>
        <div class="p-item"><span>العصر</span><small>+10 دقائق</small><b id="t-asr">--:--</b></div>
        <div class="p-item"><span>المغرب</span><small>+10 دقائق</small><b id="t-maghrib">--:--</b></div>
        <div class="p-item"><span>العشاء</span><small>+5 دقائق</small><b id="t-isha">--:--</b></div>
      </div>
      <div class="loc-bar">
        <span id="locStatus">الافتراضي: النجف الأشرف</span>
        <button onclick="doRequestLocation()" class="btn-loc">📍 تحديث موقعي</button>
      </div>
      <div class="notify-bar">
        <button onclick="doRequestNotify()" class="btn-notify">🔔 تفعيل الإشعارات</button>
        <span id="notifyStatus" class="notify-state">غير مفعلة</span>
      </div>
    </div>

    <div class="counter-wrap">
      <div id="nextPrayerCounter" class="counter">جاري الحساب الفلكي...</div>
      <div class="progress-track"><div id="pBar" class="progress-fill"></div></div>
    </div>
  </header>

  <nav class="tabs">
    <button id="tab-sins" class="tab active" onclick="setTab('sins')"><span>⚠️</span> ذنوب</button>
    <button id="tab-obeys" class="tab" onclick="setTab('obeys')"><span>✨</span> طاعات</button>
    <button id="tab-qibla" class="tab" onclick="setTab('qibla')"><span>🕋</span> القبلة</button>
    <button id="tab-cfg" class="tab" onclick="setTab('cfg')"><span>⚙️</span> إعدادات</button>
  </nav>

  <main id="list" class="content"></main>

  <button id="fab" class="fab" onclick="openAdd()">+</button>

  <div id="overlay" class="overlay">
    <div class="modal">
      <h3 id="mTitle">إضافة عمل</h3>
      <input id="mName" type="text" placeholder="اسم العمل..." autocomplete="off">
      <textarea id="mNote" placeholder="ملاحظات..." rows="3"></textarea>
      <div class="modal-actions">
        <button onclick="saveData()" class="btn-primary">حفظ</button>
        <button id="deleteBtn" onclick="deleteCurrent()" class="btn-danger">حذف</button>
        <button onclick="closeModal()" class="btn-ghost">إلغاء</button>
      </div>
    </div>
  </div>
</div>

<script src="main.js?v=9"></script>
<script>
// Force update service worker
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./pwabuilder-sw.js?v=9').then(reg=>{
      console.log('SW v9 registered');
      // Force check for update
      if(reg.waiting){ reg.waiting.postMessage({type:'SKIP_WAITING'}); }
    }).catch(e=>console.log('SW fail',e));
    // Unregister old SW if needed - emergency fix
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{ window.location.reload(); });
  });
}
// Emergency: clear old caches on load
if('caches' in window){
  caches.keys().then(keys=>{
    keys.forEach(k=>{
      if(k.includes('mizan-v6') || k.includes('mizan-v8') || k.includes('mizan-v7')){
        console.log('Deleting old cache', k);
        caches.delete(k);
      }
    });
  });
}
</script>

</html>
